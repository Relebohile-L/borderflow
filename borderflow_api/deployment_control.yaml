apiVersion: apps/v1
kind: Deployment
metadata:
  name: borderflow-api-control
spec:
  replicas: 1
  selector:
    matchLabels:
      app: borderflow-api-control
  template:
    metadata:
      labels:
        app: borderflow-api-control
    spec:
      containers:
      - name: api
        image: borderflow-api:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 5000
        env:
        - name: SITE
          value: "control"