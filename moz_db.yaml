apiVersion: v1
kind: Service
metadata:
  name: moz-db
spec:
  clusterIP: None
  selector:
    app: moz-db
  ports:
    - port: 3306
---
apiVersion: v1
kind: Service
metadata:
  name: moz-db-service
spec:
  type: NodePort
  selector:
    app: moz-db
  ports:
    - port: 3306
      targetPort: 3306
      nodePort: 30012
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: moz-db
spec:
  serviceName: moz-db
  replicas: 1
  selector:
    matchLabels:
      app: moz-db
  template:
    metadata:
      labels:
        app: moz-db
    spec:
      containers:
        - name: mariadb
          image: mariadb:10.6
          env:
            - name: MYSQL_ROOT_PASSWORD
              value: root
            - name: MYSQL_DATABASE
              value: borderflow_moz
          ports:
            - containerPort: 3306
          volumeMounts:
            - name: data
              mountPath: /var/lib/mysql
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi